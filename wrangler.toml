# Pages: não uses `wrangler deploy` (é para Workers). Usa `npm run deploy`.
# wrangler.toml
name = 'practical-prompt-engineering-code-exercise'
compatibility_date = "2024-11-01"
pages_build_output_dir = "."

[[d1_databases]]
binding = "DB"
database_name = "prompt-library-db"
# Definir em .env (local) ou no CI: D1_DATABASE_ID=...
database_id = "${D1_DATABASE_ID}"